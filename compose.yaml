name: market

services:
  postgres:
    image: postgres:17.10-alpine
    container_name: market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: market_admin
      POSTGRES_PASSWORD: market_admin_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - market

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    container_name: market-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
      - "18081:18081"
      - "19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - market

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    container_name: market-kafka-init
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    volumes:
      - ./infrastructure/kafka:/infrastructure/kafka:ro
    entrypoint: ["/bin/bash", "/infrastructure/kafka/create-topics.sh"]
    networks:
      - market

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.10.0
    container_name: market-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c 'echo "$${CONSOLE_CONFIG_FILE}" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8088:8080"
    networks:
      - market

volumes:
  postgres_data:
  redpanda_data:

networks:
  market:
    name: market_net
    driver: bridge
